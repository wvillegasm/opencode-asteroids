name: Release (develop)

on:
  push:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: release-develop
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Read version from package.json
        id: ver
        run: echo "version=v$(bun -e 'console.log(require("./package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: skip
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.ver.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (tag exists)
        if: steps.skip.outputs.exists == 'true'
        run: echo "Tag ${{ steps.ver.outputs.version }} already exists; skipping release."

      - name: Build binary
        if: steps.skip.outputs.exists != 'true'
        run: bun run build

      - name: Rename binary
        if: steps.skip.outputs.exists != 'true'
        run: mv weather weather-linux-x64

      - name: Create release
        if: steps.skip.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Release ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: weather-linux-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}