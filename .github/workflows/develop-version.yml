name: Auto version (develop)

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: version-develop
  cancel-in-progress: false

jobs:
  version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Detect manual version change
        id: detect
        run: |
          git show "${{ github.event.pull_request.base.sha }}:package.json" > "$RUNNER_TEMP/base-package.json"
          old=$(node -p "require('$RUNNER_TEMP/base-package.json').version")
          new=$(node -p "require('$PWD/package.json').version")
          echo "current=$new" >> "$GITHUB_OUTPUT"
          if [ "$old" != "$new" ]; then
            echo "Manual version change detected: $old -> $new. Skipping auto-bump."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No version change in PR (version is $new). Auto-bumping patch."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute patch bump
        id: bump
        if: steps.detect.outputs.changed == 'false'
        run: |
          version="${{ steps.detect.outputs.current }}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version '$version' is not a plain major.minor.patch value; cannot auto-bump."
            exit 1
          fi
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          echo "next=$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"

      - name: Write package.json
        if: steps.detect.outputs.changed == 'false'
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("./package.json", "utf8"));
            p.version = "${{ steps.bump.outputs.next }}";
            fs.writeFileSync("./package.json", JSON.stringify(p, null, "\t") + "\n");
          '

      - name: Commit & push
        if: steps.detect.outputs.changed == 'false'
        run: |
          if git diff --quiet -- package.json; then
            echo "package.json unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to v${{ steps.bump.outputs.next }} [auto]"
          git pull --rebase origin develop
          git push origin HEAD:develop
